name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  composer:
    name: Composer validation and audit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Composer audit
        run: composer audit --locked --abandoned=report

  phpstan:
    name: PHPStan level max (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, simplexml
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  xml:
    name: XLIFF validation (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: simplexml
          coverage: none

      - name: Validate XLIFF
        run: php Build/Scripts/validate-xlf.php
