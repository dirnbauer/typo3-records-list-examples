name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  COMPOSER_INSTALL_FLAGS: --no-progress --prefer-dist --no-interaction

jobs:
  lint:
    name: Lint and Composer checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none
      # The exact matching Records List Types version is deliberate; Composer
      # warns about exact pins, while ComposerManifestTest enforces this pair.
      - run: composer validate --no-check-lock
      - run: composer install ${{ env.COMPOSER_INSTALL_FLAGS }}
      # TYPO3 Core advisories cannot be fixed from this repository, so the
      # audit reports but does not block the pipeline.
      - name: Security audit (report only)
        continue-on-error: true
        run: composer audit --abandoned=report
      - run: Build/Scripts/runTests.sh -s lint

  cgl:
    name: Coding guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none
      - run: composer install ${{ env.COMPOSER_INSTALL_FLAGS }}
      - run: Build/Scripts/runTests.sh -s cgl

  phpstan:
    name: PHPStan level 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none
      - run: composer install ${{ env.COMPOSER_INSTALL_FLAGS }}
      - run: Build/Scripts/runTests.sh -s phpstan

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            experimental: false
          - php: '8.5'
            experimental: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: none
      - run: composer install ${{ env.COMPOSER_INSTALL_FLAGS }}
      - run: Build/Scripts/runTests.sh -s unit

  functional:
    name: Functional tests (PHP ${{ matrix.php }}, MariaDB 10.11)
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            experimental: false
          - php: '8.5'
            experimental: true
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: typo3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
      typo3DatabaseName: typo3_test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mysqli, pdo_mysql
          coverage: none
      - run: composer install ${{ env.COMPOSER_INSTALL_FLAGS }}
      - run: Build/Scripts/runTests.sh -s functional
