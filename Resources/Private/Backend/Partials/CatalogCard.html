<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    One catalog card: the image (or a placeholder), Core's record icon,
    title and state badges, the teaser, the translations and Core's
    controls. The view is registered with displayColumns = label,teaser.

    Arguments: record, table
</f:comment>

<f:variable name="titleId" value="examples-title-{table.tableIdentifier}-{record.uid}" />
<li class="rle-catalog__item"
    data-uid="{record.uid}"
    {f:if(condition: table.multiSelectEnabled, then: 'data-multi-record-selection-element="true"')}>
    <article class="card rle-catalog-card{f:if(condition: record.hidden, then: ' rle-catalog-card--hidden')}"
             aria-labelledby="{titleId}"
             data-table="{record.tableName}"
             data-uid="{record.uid}"
             data-record-title="{record.title}">
        <div class="card-image rle-catalog-card__image">
            <f:if condition="{record.thumbnailUrl}">
                <f:then>
                    <img src="{record.thumbnailUrl}" alt="" loading="lazy" />
                </f:then>
                <f:else>
                    <p class="rle-catalog-card__placeholder">
                        <core:icon identifier="actions-image" size="medium" />
                        <f:translate key="records_list_examples.messages:catalog.placeholder.noImage" />
                    </p>
                </f:else>
            </f:if>
        </div>
        <div class="card-header rle-catalog-card__header">
            <f:if condition="{table.multiSelectEnabled}">
                <f:render partial="Record/Checkbox" arguments="{record: record}" />
            </f:if>
            <span class="rlt-record-icon"><f:render partial="Record/Icon" arguments="{record: record}" /></span>
            <div class="card-header-body">
                <h2 class="card-title rle-catalog-card__title" id="{titleId}"><f:render partial="Record/Title" arguments="{record: record}" /></h2>
                <span class="rlt-badges"><f:render partial="Record/States" arguments="{record: record}" /></span>
            </div>
        </div>
        <f:variable name="teaserShown" value="0" />
        <f:for each="{record.displayValues}" as="field">
            <f:if condition="!{teaserShown} && {field.type} == 'text' && !{field.isLabelField} && {field.formatted}">
                <div class="card-body"><p class="rle-catalog-card__teaser">{field.formatted}</p></div>
                <f:variable name="teaserShown" value="1" />
            </f:if>
        </f:for>
        <f:if condition="{record.translations}">
            <f:render partial="TranslationStrip" arguments="{record: record}" />
        </f:if>
        <div class="card-footer rle-catalog-card__footer">
            <f:render partial="Record/Controls" arguments="{record: record}" />
        </div>
    </article>
</li>

</html>
