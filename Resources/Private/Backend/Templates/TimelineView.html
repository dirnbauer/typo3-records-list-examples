<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Timeline View - Vertical timeline with date markers.
    Layout-only template; shared chrome lives in Partials/.
</f:comment>

<records-list-types-actions>
<div class="rle-timeline-container">
    <f:render partial="RecordListTables" arguments="{
        tableData: tableData,
        currentTable: currentTable,
        tableConfig: tableConfig,
        recordListPartial: 'TimelineRecordList',
        viewSlug: 'timeline'
    }" />
</div>
</records-list-types-actions>

</html>
