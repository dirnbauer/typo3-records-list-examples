<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Timeline view: a date next to one card per record.

    Table/Section of records_list_types frames each table like the list
    view (filters, heading, selection bar, pagination, empty state); only
    the list and the TimelineItem partial are timeline specific.
</f:comment>

<records-list-types-actions class="rlt-view">
    <f:for each="{tableData}" as="table">
        <f:render partial="Table/Section" arguments="{table: table, currentTable: currentTable, sortingControls: 1}" contentAs="body">
            <f:if condition="{table.multiSelectEnabled}">
                <div class="rlt-toolbar"><f:render partial="Table/SelectionToggle" arguments="{id: 'examples-selection-{table.tableIdentifier}'}" /></div>
            </f:if>
            <ol class="rle-timeline" aria-label="{table.tableLabel}">
                <f:for each="{table.records}" as="record">
                    <f:render partial="TimelineItem" arguments="{record: record, table: table}" />
                </f:for>
            </ol>
        </f:render>
    </f:for>
</records-list-types-actions>

</html>
