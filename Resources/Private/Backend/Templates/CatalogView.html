<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    Catalog view: large image cards in a responsive grid.

    Table/Section of records_list_types frames each table like the list
    view (filters, heading, selection bar, pagination, empty state); only
    the grid and the CatalogCard partial are catalog specific.
</f:comment>

<records-list-types-actions class="rlt-view">
    <f:for each="{tableData}" as="table">
        <f:render partial="Table/Section" arguments="{table: table, currentTable: currentTable, sortingControls: 1}" contentAs="body">
            <f:if condition="{table.multiSelectEnabled} || {table.hasThumbnails}">
                <div class="rlt-toolbar">
                    <f:if condition="{table.multiSelectEnabled}">
                        <f:render partial="Table/SelectionToggle" arguments="{id: 'examples-selection-{table.tableIdentifier}'}" />
                    </f:if>
                    <f:if condition="{table.hasThumbnails}">
                        <p class="rlt-hint">
                            <core:icon identifier="actions-info" size="small" />
                            <f:translate key="records_list_types.messages:image.previewOnly" />
                        </p>
                    </f:if>
                </div>
            </f:if>
            <ul class="rle-catalog" aria-label="{table.tableLabel}">
                <f:for each="{table.records}" as="record">
                    <f:render partial="CatalogCard" arguments="{record: record, table: table}" />
                </f:for>
            </ul>
        </f:render>
    </f:for>
</records-list-types-actions>

</html>
